title: Informatiepagina Spelavond Connect to Perform
landing-tekst: Welkom bij de CTP Open Spelavond! Een inspirerende avond waar je
  vrijblijvend kunt deelnemen aan het Connect to Perform spel. Maak kennis met
  ons gedachtegoed en onze organisatie.
pagina-afbeelding: /assets/images/upload/connect-to-perform-ingevuld.jpg
pagina-titel: Over de CTP Open Spelavond
welkom-tekst: >-
  ## Wat houdt de CTP Open Spelavond in?


  De CTP Open Spelavond is een unieke gelegenheid om op een interactieve en speelse manier kennis te maken met het Connect to Perform (CTP) model. Tijdens deze avond krijg je de kans om het spel te spelen, nieuwe inzichten op te doen en te ontdekken hoe je jouw prestaties en samenwerking kunt verbeteren.


  #### Doelen en voordelen:


  * **Inzicht in het CTP model**: Leer de principes en methoden achter Connect to Perform: in één zin wat het CTP model is.

  * **Netwerken**: Ontmoet gelijkgestemden en breid je professionele netwerk uit.

  * **Praktische ervaring**: Ervaar direct hoe het CTP model in de praktijk werkt.


  #### Doelgroep:


  Wanneer is het spel iets voor jou? Als je in een team zit waar veel weerstand is, en je wil hier invloed op uitoefenen. Als je iets wil veranderen binnen je team en het wil maar niet lukken. Als je manager bent en je aansturing niet altijd oplevert wat je hoopt. Als je een (interne) adviesrol hebt en je kennis en kunde over cultuurverandering wil uitbreiden.\

  Of je nu een leidinggevende, teamlid of zelfstandig professional bent, de CTP Open Spelavond biedt waardevolle inzichten en tools die je direct kunt toepassen. 


  Programma van de Avond


  **Tijdschema:**


  * **19:30:** Start bijeenkomst digitaal

  * **19:35 - 20:00**: Introductie en uitleg van het CTP model

  * **20:00 - 21:45**: Spelsessies

  * **21:45 - 22:00**: Lessons learned en afronding


