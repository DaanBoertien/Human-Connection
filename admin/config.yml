backend:
  name: git-gateway
  branch: dev

media_folder: assets/images/upload/

collections:
- name: "team"
  label: "Teamleden"
  label_singular: "Teamlid"
  folder: "_team/"
  create: true
  summary: "{{title}}"
  slug: "{{title}}"
  editor:
    preview: false
  fields:
  - { label: "Layout", name: "layout", widget: "hidden", default: "teammembers" }
  - { label: "Naam", name: "title", widget: "string" }
  - { label: "Functie", name: "function", widget: "string" }
  - { label: "Emailadres", name: "email", widget: "string" }
  - { label: "Telefoonnummer", name: "phonenumber", widget: "string" }
  - { label: "Foto", name: "photo_url", widget: "image" }
  - { label: "Omschrijving foto", name: "photo_description", widget: "string" }
  - { label: "Omschrijving", name: "summary", widget: "markdown" }
  - { label: "Uitleg", name: "uitleg", widget: "markdown" }
  - label: "Achtergrondkleur"
    name: "bg_color"
    widget: "select"
    options: [ "Donkerblauw", "Lichtblauw", "Groen", "Grijs", "Geel", "Rood" ]
  - { label: "Titel", name: "card_title", widget: "string" }
  - { label: "Soundbites", name: "soundbites", widget: "string" }
  - { label: "Soundbites Tekst", name: "soundbites_text", widget: "text" }

- name: "i18n"
  label: "Translations"
  files:
  - name: "dutch"
    label: "Dutch (Nederlands)"
    file: "_i18n/nl.yml"
    editor:
      preview: false
    fields:
    - label: "Global Settings"
      name: "global"
      widget: "object"
      fields:
      - { label: "Nederlands Label", name: "nederlands", widget: "string" }
      - { label: "English Label", name: "english", widget: "string" }
      - { label: "Site Title", name: "site_title", widget: "string" }

    - label: "Navigation"
      name: "nav"
      widget: "object"
      fields:
      - { label: "Home URL", name: "home_url", widget: "string" }
      - { label: "Logo Alt Text", name: "logo_alt_text", widget: "string" }
      - { label: "Who We Are URL", name: "wie_wij_zijn_url", widget: "string" }
      - { label: "Who We Are Text", name: "wie_wij_zijn_text", widget: "string" }
      - { label: "Team Base URL", name: "team_base_url", widget: "string" }
      - { label: "What We Do Text", name: "wat_wij_doen_text", widget: "string" }
      - { label: "How We Work URL", name: "hoe_wij_werken_url", widget: "string" }
      - { label: "How We Work Text", name: "hoe_wij_werken_text", widget: "string" }
      - { label: "What We Do URL", name: "wat_wij_doen_url", widget: "string" }
      - { label: "CTP Contact URL", name: "ctp-contact", widget: "string" }
      - { label: "Connect to Perform URL", name: "connect_to_perform_url", widget: "string" }
      - { label: "Connect to Perform Text", name: "connect_to_perform_text", widget: "string" }
      - { label: "Confidential Advisor URL", name: "vertrouwenspersoon_url", widget: "string" }
      - { label: "Confidential Advisor Text", name: "vertrouwenspersoon_text", widget: "string" }
      - { label: "Coaching URL", name: "coaching_url", widget: "string" }
      - { label: "Coaching Text", name: "coaching_text", widget: "string" }
      - { label: "Contact Text", name: "contact_text", widget: "string" }
      - { label: "Contact URL", name: "contact_url", widget: "string" }
      - { label: "Work With Us URL", name: "werken_bij_url", widget: "string" }
      - { label: "Work With Us Text", name: "werken_bij_text", widget: "string" }
      - { label: "Dutch Language", name: "lang_nl", widget: "string" }
      - { label: "English Language", name: "lang_en", widget: "string" }
      - { label: "Call Us", name: "call_us", widget: "string" }
      - { label: "Email Us", name: "email_us", widget: "string" }

    - label: "Home Page"
      name: "home"
      widget: "object"
      fields:
      - { label: "Slogan", name: "slogan", widget: "string" }
      - { label: "Landing Text", name: "landing-tekt", widget: "markdown" }
      - { label: "Page Image", name: "pagina-afbeelding", widget: "string" }
      # Add all the other home page fields here

    - label: "Coaching Page"
      name: "coaching"
      widget: "object"
      fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Landing Text", name: "landing-tekst", widget: "markdown" }
      - { label: "Page Image", name: "pagina-afbeelding", widget: "string" }
      - { label: "Page Title", name: "pagina-titel", widget: "string" }
      - { label: "Coaching Text", name: "coaching-tekst", widget: "markdown" }
    # Add similar blocks for each of your pages
    # - label: "How We Work Page"
    #   name: "hoe-wij-werken"
    #   ...

  - name: "english"
    label: "English"
    file: "_i18n/en.yml"
    editor:
      preview: false
    fields:
    - label: "Global Settings"
      name: "global"
      widget: "object"
      fields:
      - { label: "Dutch Label", name: "nederlands", widget: "string" }
      - { label: "English Label", name: "english", widget: "string" }
      - { label: "Site Title", name: "site_title", widget: "string" }

    # Copy the same structure from the Dutch translation,
    # but adjust field labels to indicate these are English translations

    # For example:
    - label: "Navigation (English)"
      name: "nav"
      widget: "object"
      fields:
      - { label: "Home URL", name: "home_url", widget: "string" }
      - { label: "Logo Alt Text", name: "logo_alt_text", widget: "string" }
      # ...etc
