# Netlify CMS Configuration for Human Connection Website
# Version 4: Reordered page sections and ensured ALL labels are Dutch.

backend:
  name: github
  branch: master
  repo: DaanBoertien/Human-Connection

# Location for media uploads relative to the project root
media_folder: assets/images/upload/

# Define content types (Collections)
collections:
# Collection for Team Members
- name: "team"
  label: "Teamleden" # Collection label (Dutch)
  label_singular: "Teamlid" # Singular label (Dutch)
  folder: "_team/" # Folder where team member files are stored
  create: true # Allow creating new team members
  summary: "{{nl.title}}" # How items are summarized in the list view (using Dutch title)
  slug: "{{nl.title | slugify}}" # How filenames are generated (using Dutch title)
  editor:
    preview: false # Disable CMS preview for this collection
  fields:
  # Fields for each team member
  - { label: "Layout", name: "layout", widget: "hidden", default: "teammembers" } # Hidden field for Jekyll layout
  - { label: "E-mail", name: "email", widget: "string" } # Translated label
  - { label: "Telefoonnummer", name: "phonenumber", widget: "string" } # Translated label
  - { label: "Foto", name: "photo_url", widget: "image" } # Translated label
  - label: "Achtergrondkleur" # Translated label
    name: "bg_color"
    widget: "select"
    options: [ "Donkerblauw", "Lichtblauw", "Groen", "Grijs", "Geel", "Rood" ] # Color options
  - { label: "Menu Status", name: "menu", widget: "hidden", required: false, default: "menu-active" } # Translated label (e.g., show in menu)

  # Nested object for Dutch content specific to team members
  - label: "Nederlandse Content" # Translated label for the Dutch content group
    name: "nl" # Key for Dutch content in the file
    widget: "object"
    collapsed: false # Start expanded in CMS UI
    fields:
    # Fields within the Dutch content object
    - { label: "Naam", name: "title", widget: "string" } # Translated label
    - { label: "Functie", name: "function", widget: "string" } # Translated label
    - { label: "Fotobeschrijving", name: "photo_description", widget: "string" } # Translated label
    - { label: "Samenvatting", name: "summary", widget: "markdown" } # Translated label
    - { label: "Uitleg", name: "uitleg", widget: "markdown" } # Translated label
    - { label: "Kaart Titel", name: "card_title", widget: "string" } # Translated label
    - { label: "Soundbites Titel", name: "soundbites", widget: "string" } # Translated label
    - { label: "Soundbites Tekst", name: "soundbites_text", widget: "text" } # Translated label

  # Nested object for English content specific to team members
  - label: "Engelse Content" # Translated label for the English content group
    name: "en" # Key for English content in the file
    widget: "object"
    collapsed: true # Start collapsed in CMS UI
    fields:
    # Fields within the English content object (Using Dutch labels for UI consistency)
    - { label: "Naam", name: "title", widget: "string" } # Dutch label
    - { label: "Functie", name: "function", widget: "string" } # Dutch label
    - { label: "Fotobeschrijving", name: "photo_description", widget: "string" } # Dutch label
    - { label: "Samenvatting", name: "summary", widget: "markdown" } # Dutch label
    - { label: "Uitleg", name: "uitleg", widget: "markdown" } # Dutch label
    - { label: "Kaart Titel", name: "card_title", widget: "string" } # Dutch label
    - { label: "Soundbites Titel", name: "soundbites", widget: "string" } # Dutch label
    - { label: "Soundbites Tekst", name: "soundbites_text", widget: "text" } # Dutch label

# Collection for managing content stored in YAML files (e.g., translations, site data)
- name: "translations"
  label: "Pagina's & Vertalingen" # Collection label (Dutch) - Clarified purpose
  files:
  # Define specific files managed by this collection
  # Dutch translations/content file
  - name: "dutch"
    label: "Nederlands" # Label for this specific file in CMS (Dutch)
    file: "_i18n/nl.yml" # Path to the Dutch YAML file
    editor:
      preview: false # Disable CMS preview
    fields:
