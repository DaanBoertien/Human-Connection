# --- Start: Keep backend, top-level i18n, media_folder, public_folder as before ---
backend:
  name: git-gateway
  branch: dev

i18n:
  locales: [ nl, en ]
  default_locale: nl
  structure: multiple_files

media_folder: assets/images/upload/
public_folder: /assets/images/upload/
# --- End: Keep backend, top-level i18n, media_folder, public_folder as before ---

collections:
# --- Team Collection (Keep as before) ---
- name: "team"
  label: "Team Members"
  label_singular: "Team Member"
  folder: "_team/{{locale}}/"
  create: true
  i18n: true
  structure: folder
  summary: "{{title}}"
  slug: "{{title}}"
  editor:
    preview: false
  fields:
  # ... (team fields remain the same as the previous correct version) ...
  - { label: "Layout", name: "layout", widget: "hidden", default: "teammembers" }
  - { label: "Name", name: "title", widget: "string", i18n: true }
  - { label: "Function", name: "function", widget: "string", i18n: true }
  - { label: "Email Address", name: "email", widget: "string" }
  - { label: "Phone Number", name: "phonenumber", widget: "string" }
  - { label: "Photo", name: "photo_url", widget: "image" }
  - { label: "Photo Description", name: "photo_description", widget: "string", i18n: true }
  - { label: "Summary", name: "summary", widget: "markdown", i18n: true }
  - { label: "Explanation", name: "uitleg", widget: "markdown", i18n: true }
  - label: "Background Color"
    name: "bg_color"
    widget: "select"
    options: [ "Donkerblauw", "Lichtblauw", "Groen", "Grijs", "Geel", "Rood" ]
    i18n: false
  - { label: "Card Title", name: "card_title", widget: "string", i18n: true }
  - { label: "Soundbites", name: "soundbites", widget: "string", i18n: true }
  - { label: "Soundbites Text", name: "soundbites_text", widget: "text", i18n: true }

# --- Site Content (Files Collection - Modified) ---
- name: "site_content"
  label: "Site Content"
  # Apply i18n setting to the collection itself
  i18n: true
  # Use section_key (hidden field in each file entry) to differentiate items in UI
  identifier_field: section_key
  files:
  # --- Navigation ---
  - name: "navigation" # This name might be less relevant now identifier_field is used
    label: "Navigation" # This label should now appear correctly
    file: "_i18n/{{locale}}.yml"
    # i18n: true <-- REMOVED from individual file entries
    editor:
      preview: false
    fields:
    # MUST have this hidden field matching the top-level key in your YAML
    - { label: "Section Key", name: "section_key", widget: "hidden", default: "nav" }
    # ... (navigation fields remain the same, ensure i18n: true/duplicate is set correctly on fields themselves) ...
    - { label: "Home URL", name: "home_url", widget: "string", i18n: "duplicate" }
    - { label: "Logo Alt Text", name: "logo_alt_text", widget: "string", i18n: true }
    - { label: "Who We Are URL", name: "wie_wij_zijn_url", widget: "string", i18n: "duplicate" }
    - { label: "Who We Are Text", name: "wie_wij_zijn_text", widget: "string", i18n: true }
    - { label: "Team Base URL", name: "team_base_url", widget: "string", i18n: "duplicate" }
    - { label: "What We Do Text", name: "wat_wij_doen_text", widget: "string", i18n: true }
    - { label: "How We Work URL", name: "hoe_wij_werken_url", widget: "string", i18n: "duplicate" }
