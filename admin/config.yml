backend:
  name: git-gateway
  branch: dev # Or your main branch, e.g., main

# I18n Configuration
i18n:
  # Specify the languages you want to support
  locales: [ nl, en ]
  # Set the default language
  default_locale: nl
  # Define how i18n files are structured. 'multiple_files' suits your _i18n/nl.yml setup.
  # For folder collections like 'team', the structure can be overridden per collection.
  structure: multiple_files

media_folder: assets/images/upload/
public_folder: /assets/images/upload/ # Optional: path where media assets are served from

collections:
# --- Team Collection (Folder Collection - Separate file per language) ---
- name: "team"
  label: "Team Members" # Changed to English for UI consistency
  label_singular: "Team Member" # Changed to English
  # Store language versions in subfolders nl/ en/
  folder: "_team/{{locale}}/"
  create: true
  # Enable i18n for this collection
  i18n: true
  # Define the structure for this specific collection (overrides global)
  # 'folder' structure means files go into locale subdirectories
  structure: folder
  # Optional: Specify field used in the filename, default is 'title' if not set
  # identifier_field: slug # If you add a dedicated 'slug' field
  # Define which field is used for the preview summary
  summary: "{{title}}"
  # The slug can use the title. Ensure titles are unique or use a dedicated slug field.
  slug: "{{title}}"
  editor:
    preview: false
  fields:
  # Standard fields remain, labels updated to English for CMS UI
  - { label: "Layout", name: "layout", widget: "hidden", default: "teammembers" }
  - { label: "Name", name: "title", widget: "string", i18n: true } # Translatable
  - { label: "Function", name: "function", widget: "string", i18n: true } # Translatable
  - { label: "Email Address", name: "email", widget: "string" } # Usually not translated
  - { label: "Phone Number", name: "phonenumber", widget: "string" } # Usually not translated
  - { label: "Photo", name: "photo_url", widget: "image" } # Usually same image
  - { label: "Photo Description", name: "photo_description", widget: "string", i18n: true } # Translatable
  - { label: "Summary", name: "summary", widget: "markdown", i18n: true } # Translatable
  - { label: "Explanation", name: "uitleg", widget: "markdown", i18n: true } # Translatable
  - label: "Background Color"
    name: "bg_color"
    widget: "select"
    options: [ "Donkerblauw", "Lichtblauw", "Groen", "Grijs", "Geel", "Rood" ] # Values remain Dutch if CSS classes use them
    i18n: false # Assuming color is not language-dependent
  - { label: "Card Title", name: "card_title", widget: "string", i18n: true } # Translatable
  - { label: "Soundbites", name: "soundbites", widget: "string", i18n: true } # Translatable
  - { label: "Soundbites Text", name: "soundbites_text", widget: "text", i18n: true } # Translatable

# --- Site Content (Files Collection - Edits sections of _i18n/{{locale}}.yml) ---
- name: "site_content"
  label: "Site Content"
  # This collection manages multiple "virtual" files within the main i18n YAML files
  files:
  # --- Navigation ---
  - name: "navigation"
    label: "Navigation"
    # Point to the main i18n file structure
    file: "_i18n/{{locale}}.yml"
    # Enable i18n for this entry
    i18n: true
    editor:
      preview: false
    # Fields correspond to the 'nav' section in your YAML
    fields:
    - { label: "Section Key", name: "section_key", widget: "hidden", default: "nav" } # Helper
    - { label: "Home URL", name: "home_url", widget: "string", i18n: "duplicate" } # Use 'duplicate' if URL is same for all langs
    - { label: "Logo Alt Text", name: "logo_alt_text", widget: "string", i18n: true }
    - { label: "Who We Are URL", name: "wie_wij_zijn_url", widget: "string", i18n: "duplicate" }
    - { label: "Who We Are Text", name: "wie_wij_zijn_text", widget: "string", i18n: true }
    - { label: "Team Base URL", name: "team_base_url", widget: "string", i18n: "duplicate" }
    - { label: "What We Do Text", name: "wat_wij_doen_text", widget: "string", i18n: true }
    - { label: "How We Work URL", name: "hoe_wij_werken_url", widget: "string", i18n: "duplicate" }
    - { label: "How We Work Text", name: "hoe_wij_werken_text", widget: "string", i18n: true }
    - { label: "What We Do URL", name: "wat_wij_doen_url", widget: "string", i18n: "duplicate" }
    - { label: "CTP Contact URL", name: "ctp-contact", widget: "string", i18n: "duplicate" }
    - { label: "Connect to Perform URL", name: "connect_to_perform_url", widget: "string", i18n: "duplicate" }
    - { label: "Connect to Perform Text", name: "connect_to_perform_text", widget: "string", i18n: true }
    - { label: "Confidential Advisor URL", name: "vertrouwenspersoon_url", widget: "string", i18n: "duplicate" }
    - { label: "Confidential Advisor Text", name: "vertrouwenspersoon_text", widget: "string", i18n: true }
    - { label: "Coaching URL", name: "coaching_url", widget: "string", i18n: "duplicate" }
    - { label: "Coaching Text", name: "coaching_text", widget: "string", i18n: true }
    - { label: "Contact Text", name: "contact_text", widget: "string", i18n: true }
    - { label: "Contact URL", name: "contact_url", widget: "string", i18n: "duplicate" }
    - { label: "Work With Us URL", name: "werken_bij_url", widget: "string", i18n: "duplicate" }
    - { label: "Work With Us Text", name: "werken_bij_text", widget: "string", i18n: true }
