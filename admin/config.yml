backend:
  name: git-gateway
  branch: dev

media_folder: assets/images/upload/

collections:
- name: "team"
  label: "Teamleden"
  label_singular: "Teamlid"
  folder: "_team/"
  create: true
  summary: "{{nl.title}}"
  slug: "{{nl.title | slugify}}"
  editor:
    preview: false
  fields:
  - { label: "Layout", name: "layout", widget: "hidden", default: "teammembers" }
  - { label: "E-mail", name: "email", widget: "string" } # Translated
  - { label: "Telefoonnummer", name: "phonenumber", widget: "string" } # Translated
  - { label: "Foto", name: "photo_url", widget: "image" } # Translated
  - label: "Achtergrondkleur" # Translated
    name: "bg_color"
    widget: "select"
    options: [ "Donkerblauw", "Lichtblauw", "Groen", "Grijs", "Geel", "Rood" ]
  - { label: "Menu Status", name: "menu", widget: "hidden", required: false, default: "menu-active" } # Translated "Menu"

  - label: "Nederlandse Content" # Translated "Dutch Content"
    name: "nl"
    widget: "object"
    collapsed: false
    fields:
    # Translated labels inside
    - { label: "Naam", name: "title", widget: "string" }
    - { label: "Functie", name: "function", widget: "string" }
    - { label: "Fotobeschrijving", name: "photo_description", widget: "string" }
    - { label: "Samenvatting", name: "summary", widget: "markdown" }
    - { label: "Uitleg", name: "uitleg", widget: "markdown" }
    - { label: "Kaart Titel", name: "card_title", widget: "string" }
    - { label: "Soundbites Titel", name: "soundbites", widget: "string" } # Assuming 'Soundbites' is a title
    - { label: "Soundbites Tekst", name: "soundbites_text", widget: "text" }

  - label: "Engelse Content" # Translated "English Content"
    name: "en"
    widget: "object"
    collapsed: true
    fields:
    # Translated labels inside
    - { label: "Naam", name: "title", widget: "string" } # Using Dutch label
    - { label: "Functie", name: "function", widget: "string" } # Using Dutch label
    - { label: "Fotobeschrijving", name: "photo_description", widget: "string" } # Using Dutch label
    - { label: "Samenvatting", name: "summary", widget: "markdown" } # Using Dutch label
    - { label: "Uitleg", name: "uitleg", widget: "markdown" } # Using Dutch label
    - { label: "Kaart Titel", name: "card_title", widget: "string" } # Using Dutch label
    - { label: "Soundbites Titel", name: "soundbites", widget: "string" } # Using Dutch label
    - { label: "Soundbites Tekst", name: "soundbites_text", widget: "text" } # Using Dutch label

