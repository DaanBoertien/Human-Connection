    - { label: "CTP Contact URL", name: "ctp-contact", widget: "string", i18n: "duplicate" }
    - { label: "Connect to Perform URL", name: "connect_to_perform_url", widget: "string", i18n: "duplicate" }
    - { label: "Connect to Perform Text", name: "connect_to_perform_text", widget: "string", i18n: true }
    - { label: "Confidential Advisor URL", name: "vertrouwenspersoon_url", widget: "string", i18n: "duplicate" }
    - { label: "Confidential Advisor Text", name: "vertrouwenspersoon_text", widget: "string", i18n: true }
    - { label: "Coaching URL", name: "coaching_url", widget: "string", i18n: "duplicate" }
    - { label: "Coaching Text", name: "coaching_text", widget: "string", i18n: true }
    - { label: "Contact Text", name: "contact_text", widget: "string", i18n: true }
    - { label: "Contact URL", name: "contact_url", widget: "string", i18n: "duplicate" }
    - { label: "Work With Us URL", name: "werken_bij_url", widget: "string", i18n: "duplicate" }
