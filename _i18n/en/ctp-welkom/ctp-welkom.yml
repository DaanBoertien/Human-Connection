title: Information Page Connect to Perform Game Evening
landing-tekst: >-
  Welcome to the CTP Open Game Evening! An inspiring evening where you can participate in the Connect to Perform game without obligation. Get acquainted with our philosophy and our organization.
pagina-afbeelding: /assets/images/upload/connect-to-perform-ingevuld.jpg
pagina-titel: About the CTP Open Game Evening
welkom-tekst: >-
  ## What does the CTP Open Game Evening entail?


  The CTP Open Game Evening is a unique opportunity to get acquainted with the Connect to Perform (CTP) model in an interactive and playful way. During this evening, you get the chance to play the game, gain new insights, and discover how you can improve your performance and collaboration.


  #### Goals and benefits:


  * **Insight into the CTP model**: Learn the principles and methods behind Connect to Perform, including its core concept. * **Networking**: Meet like-minded people and expand your professional network. * **Practical experience**: Directly experience how the CTP model works in practice.




  #### Target Audience:


  When is the game right for you? If you are in a team with a lot of resistance, and you want to influence this. If you want to change something within your team and it just isn't working out. If you are a manager and your leadership doesn't always deliver what you hope for. If you have an (internal) advisory role and want to expand your knowledge and skills regarding culture change.


  Whether you are a manager, team member, or independent professional, the CTP Open Game Evening offers valuable insights and tools that you can apply immediately.




  **Evening Program:**


  * **19:30:** Start of digital meeting * **19:35 - 20:00**: Introduction and explanation of the CTP model * **20:00 - 21:45**: Game sessions * **21:45 - 22:00**: Lessons learned and wrap-up


