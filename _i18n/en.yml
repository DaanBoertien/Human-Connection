hoe-wij-werken:
  title: How we work
  landing-tekst: |-
    Everything we do is tailor-made, because every change has its own dynamics, complexity, and pace.

    We have extensive knowledge and have vast experience in several methodologies. We use theories and models as a collective frame of reference and common language. The emphasis for us is always on direct applicability in daily work.
  pagina-afbeelding: /assets/images/upload/impact.jpg
  waar-wij-voor-staan: Methods and formats
  waar-wijvoor-staan-tekst: |-
    Examples of methods and formats we are familiar with (a.o.): 

    \- Our Connect to Perform philosophy is at the base of our consultance work

    \- Working and collaboration methods/formats like agile/scrum, Scaling Up and Deep Democracy

    \- Teamreflection using Lencioni, Belbin and Inisghts Discovery

    \- Business Drawing: powerful tool to visualize concepts 

    \- Personal development and coaching using Voice Dialogue, Co-active coaching, ACT

    \- Organizational Change theories

    Development-oriented as we are, we stay up to date with the latest insights in theory and practice.
  waarde-1-titel: 1. Contact and context
  waarde-1-tekst: "It starts with personal contact. Together with a client, we look at the context of the organization and the people on the work floor is. We look with a broad view on the whole: 'what is really going on here?'"
  waarde-1-afbeelding: ''
  waarde-2-titel: 2. Pragmatic design and advice
  waarde-2-tekst: Based on the intake, we advise on an effective approach. We let the organization take the lead as much as possible. We design and plan ahead, preferably together with the people involved. We create realistic expectations and frameworks.
  waarde-2-afbeelding: ''
  waarde-3-titel: 3.  Guidance
  waarde-3-tekst: We guide the implementation step by step, so that adjustment is always possible. We work methodically where necessary. We understand the dynamics and complexity of organizations and always have an eye for the individual and their work and private context.
  waarde-3-afbeelding: ''
  waarde-4-titel: 4. Pushing through until it really works​
  waarde-4-tekst: Especially at difficult moments, or when things seem too quiet, we help to push through.  We help turn awareness into action on the work floor. Not clinging rigidly to the 'plan from six months ago', but again in relation to the current course and circumstances of the organization. With a focus on long-term results.​
  waarde-4-afbeelding: ''
  waarde-5-titel: 5. Evaluating
  waarde-5-tekst: Development is never finished. However, we find it important that our clients can continue independently for a while after our guidance. We help to evaluate sharply and anticipate future developments. And we always keep the line open for a quick chat or catch-up.
  waarde-5-afbeelding: ''
connect-to-perform:
  title: Connect to Perform
  pagina-afbeelding: /assets/images/upload/verandering-transitie.jpg
  landing-tekst: "'Connect to Perform' is the philosophy that forms the basis for Human Connection's consultancy work. It demonstrates how teams and organizations can move to a more effective and pleasant way of working by making (mutual) connections. To bridge the gap between 'theory' and 'self-application', we have designed a game that is played with great success in organizations and during our open evenings."
  methoden: Connect to Perform Culture Development
  methoden-tekst: ''
  pagina-illustratie: /assets/images/upload/connect-to-perform-eng.png
  werkwijze-titel: 'Connect to Perform: the game'
  werkwijze-tekst: |-
    During the game, using a fictional situation, you will gain insight into the methodology and possible interventions to develop organizational culture and performance. You will learn how you can identify which development phase an organization (or team) culture is in. Based on practical examples, you will find out what is needed to take the next development step and what interventions have a counterproductive effect.

    You will gain insight into some fifty different interventions that can be applied in the work practice, to influence the behavior and culture of a team and organization. In short you will be immersed 
    interactively in our successful approach on how to make more impact with your team in a few hours.
  werkvorm-titel: Open Game Evening
  werkvorm-tekst: |-
    As an introduction, we organize an open game evening several times a year, nowadays mostly online, where our relations and interested parties are welcome to get acquainted with this methodology. (participation is completely free and without further obligations). Moreover, experience shows that it is very interesting to exchange thoughts with people you didn't know before and who are working in different organizations. When you partcipate, you will get access to videos with explanations and background information. 

    In organizations, we play the game (online or offline) in MT trajectories or leadership programs. We have different formats, depending on the time and interest of the target group, and we also tailor the game content where necessary. The translation to the work context, in light of the organization's strategy, and the concretization 'what will I do with it tomorrow' are important parts of the debriefing and possible follow-up.

    The game can also be requested as a standalone workshop. Think of a half or full day, online or offline, for a group of 4 to 80 participants. For more information, please send an email to Jojanneke.
  button1: Learn more about Connect to Perform
  more-info: /assets/images/upload/connect_to_perform.pdf
  button2: Sign up here for the open game evening
vertrouwenspersoon:
  title: Confidential advisor
  landing-tekst: |-
    **Confidential advisor and prevention as a priority for a socially safe workplace**

    At a time during which the emphasis is increasingly placed on creating a healthy and pleasant work climate, the question arises: how can organizations ensure a safe environment for their employees? Appointing an (internal) confidential advisor is a commonly chosen first step for companies. To actually create and maintain a safe working environment, broader measures and sometimes even a culture change are needed.

    Integrating social safety in the workplace turns out to be a crucial factor in striving for a sustainably healthy organization.

    If there is a pleasant learning and working climate, results are better, work is done more effectively, and there is more opportunity for innovation. But what exactly does this entail, and how can organizations achieve this?
  pagina-afbeelding: /assets/images/upload/sociale-veiligheid.webp
  pagina-titel: Confidential Advisor
  vertrouwenspersoon-tekst: |-
    ### What is a socially safe workplace?

    Every workplace is different, every corporate culture is different. However, there are a number of elements that indicate a socially safe workplace:

    * Employees express themselves easily.  
    * They *also* talk about bottlenecks in the execution of their work.  
    * They talk openly and freely.  
    * They speak out without fear of consequences.

    ### Broad, systemic approach

    Human Connection distinguishes itself by a broader approach to creating a socially safe workplace, where a confidential advisor is an essential part.

    The focus is on preventive measures, in addition to providing help with context analysis, interventions, and guidance, should escalation occur. We do this with a well-thought-out and systemic approach that we have been using and further developing since 1998. For more information, look [here](https://www.humanc.nl/en/how-we-work/).

    ### Human Connection offers:

    * Certified confidential advisors  
    * Each confidential advisor brings at least one additional expertise  
    * Replacement during illness or vacation  
    * Mutual intervision (peer consultation), unlocks an even broader perspective on issues  
    * Experience in involving the entire organization at the start, continuation, and execution of (change) trajectories.

    ### Want to know more?

    Do you want to know more about how Human Connection views the role of the confidential advisor and prevention as a priority within a healthy workplace? Download our whitepaper (Dutch) here with key factors for a socially safe working environment.
coaching:
  title: Coaching
  landing-tekst: |-
    Do you want more self-insight, more control over your approach to certain matters, to get rid of certain patterns, or concrete tools to be more effective in your work?

    With individual coaching, we help you in a way (live, outdoors, online, on the job) and rhythm (a quick boost or rather a calmer, somewhat longer trajectory) that suits you.

    Based on an intake, you will choose the coach that suits you, and jointly  determine what the coaching trajectory will look like for you. The coaching trajectory will be tailored to your needs, goals, and context. On one hand, this involves depth: what is the background of your coaching question? And on the other hand, about practical application: translating the insights you will gain into your life and work.

    We coach from the work floor up to the executive level. Independently and confidentially. Coaching trajectories can be linked to an organizational development trajectory or a leadership program. But also for individuals looking for more balance or the next career step.
  pagina-afbeelding: /assets/images/upload/kompas.jpg
  pagina-titel: Coaching
  coaching-tekst: |-
    **Coaching Themes**

    The goal and theme of the coaching trajectory are always individually determined and often a combination of several elements. In practice, we often work with the following themes:

    * Personal development
    * Communication
    * Balance and resilience
    * Stress, burn-out
    * Career development

    **Methods and formats**
    We work with methods and materials from various management theories, psychology, and approaches such as Voice Dialogue, Co-active coaching, ACT, Insights Benelux, and Deep Democracy.
    In a coaching trajectory, various conversation forms and elements can be used, such as: conversations (live, online, or walking), deepening assignments, practical assignments, coaching on the job, three-way conversations with the manager, reading material, background articles, reflection assignments, tests, and videos.

    **Always tailor-made**
    We help you gain insight into your behavioral patterns, explore your comfort zone, and implement sustainable changes. This way, you will not only work not on your professional growth but also on achieving a healthier balance and more resilience.

    So, we don't do 'standard programs'. It's not a matter of 'give me module 2 and session type x'. Instead, we look together with you at what works. In your context, with your goals, wishes, and own wisdom.

    **The coaches**
    A large number of our colleagues are professional coaches. We all have our own background and style. What we have in common is that we stand for professionalism, confidentiality, and a broad view of the person, in their context.

    Below you will find the names of colleagues who coach:
    [Marit](https://www.humanc.nl/en/team/marit-weiss/),  [Jojanneke](https://www.humanc.nl/en/team/jojanneke-van-goinga/)[,](https://www.humanc.nl/en/team/meggie-van-de-bunt/) [Alexander, ](https://www.humanc.nl/en/team/alexander-van-ravesteyn/)[Gerke,](https://www.humanc.nl/en/team/gerke-visser/) [Petra,](https://www.humanc.nl/en/team/petra-berry/) [Zilla](https://www.humanc.nl/en/team/zilla-uiterwijk/), Simone and [Sjef.](https://www.humanc.nl/en/team/sjef-van-gool/)

    **Interested?**
    Contact one of our colleagues directly, or for more information contact [Marit.](https://www.humanc.nl/en/team/marit-weiss/)
