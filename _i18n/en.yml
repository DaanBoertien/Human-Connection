hoe-wij-werken:
  title: How we work
  landing-tekst: >-
    Everything we do is custom-made, because every change has its own dynamics, complexity, and pace.


    We have extensive knowledge in-house and are seasoned in a number of methodologies. Where necessary, we deploy these. We use theories and models as a collective frame of reference and common language. The emphasis for us is always on direct applicability in daily work.
  pagina-afbeelding: /assets/images/upload/impact.jpg
  waar-wij-voor-staan: Methods and formats
  waar-wijvoor-staan-tekst: >-
    Examples of methods and formats are: Connect to Perform culture development, agile/scrum, deep democracy, business drawing, Discovery Insights, Voice Dialogue, irreversible change, designing with the learning infrastructure, various creative formats


    Being development-oriented, we stay up to date with the latest insights in the field of theory and practice.
  waarde-1-titel: 1. Contact and context
  waarde-1-tekst: "It starts with personal contact. Together with a client, we examine what the context of the organization and the people on the work floor is. We look at the whole with a broad perspective: 'what is really going on here?'"
  waarde-1-afbeelding: ""
  waarde-2-titel: 2. Pragmatic design and advice
  waarde-2-tekst: Based on this, we provide advice on an effective approach. In doing so, we let the organization stay in control as much as possible. We design ahead, preferably together with the people involved. We create realistic expectations and frameworks.
  waarde-2-afbeelding: ""
  waarde-3-titel: 3.  Guidance
  waarde-3-tekst: We guide the implementation step by step, so adjustment is always possible. We work methodically where necessary. We understand the dynamics and complexity of organizations and always have an eye for the individual person and their work and private context.
  waarde-3-afbeelding: ""
  waarde-4-titel: 4. Pushing through until it really works​
  waarde-4-tekst: Especially at difficult moments, or when things seem too quiet, we help to push through.  We help turn awareness into action on the work floor. Not rigidly sticking to the 'plan from six months ago', but again in relation to the current course and circumstances of the organization. With a focus on long-term results.​
  waarde-4-afbeelding: ""
  waarde-5-titel: 5. Evaluating
  waarde-5-tekst: Development is never 'finished'. However, we find it important that our clients know how to continue independently for a while after our guidance. We help to evaluate sharply and anticipate future developments. And we always keep the line open for a quick sparring session or catch-up.
  waarde-5-afbeelding: ""

coaching:
  title: Coaching
  landing-tekst: >-
    Do you want more self-insight, a better handle on your approach to certain matters, to break free from certain patterns, or concrete tools to be more effective in your work?


    With individual coaching, we help you in a tailored way. In a manner (live, outdoors, online, on the job) and rhythm (a quick boost or rather a calmer, somewhat longer trajectory?) that suits you.


    Based on an intake, you choose the coach that suits you, and together you determine what the coaching trajectory looks like. We tailor every coaching trajectory to your needs, goals, and context. On one hand, this involves depth: what is the background of your coaching question? And on the other hand, practical application: translating the insights you gain into your life and work.


    We coach from the work floor up to the executive level. Independently and confidentially. It can be linked to an organizational development trajectory or leadership development. But also for individuals looking for more balance or the next career step.
  pagina-afbeelding: /assets/images/upload/kompas.jpg
  pagina-titel: Coaching
  coaching-tekst: >-
    **Coaching Themes**


    The goal and theme of the coaching trajectory are always individually determined and often a combination of multiple elements. In practice, we often work with the following themes:


    * Personal development  * Communication  * Balance and resilience | stress, burnout  * Career development


    **Methods and Forms**

    We work with methods and materials from various management theories, psychology, and approaches such as Voice Dialogue, Co-active coaching, ACT, Insights, and Deep Democracy.

    In a coaching trajectory, various conversation forms and elements can be used, such as: conversations (live, online, or walking), in-depth assignments, practical assignments, coaching on the job, three-way conversations with the manager, reading material, background articles, reflection assignments, tests, and videos.


    **Always Custom-Made**

    We help you gain insight into your behavioral patterns, explore your comfort zone, and implement sustainable changes. This way, you work not only on your professional growth but also on a healthier balance and more resilience.


    So, we don't do 'standard programs'. It's not a matter of 'give me module 2 and session type x'. Instead, we look together with you at what works. In your context, with your goals, wishes, and own wisdom.


    **The Coaches**

    A large number of our colleagues are professional coaches. We all have our own background and style. What we agree on is that we stand for professionalism, confidentiality, and a broad perspective on the person, in their context.


    Below you will find the names of colleagues who coach: [](https://www.humanc.nl/team/anne-boertien/)[Marit](https://www.humanc.nl/team/marit-weiss/), [Anne](https://www.humanc.nl/team/anne-boertien/), [Jojanneke](https://www.humanc.nl/team/jojanneke-van-goinga/), [Meggie,](https://www.humanc.nl/team/meggie-van-de-bunt/) [Alexander, ](https://www.humanc.nl/team/gerke-visser/)[Gerke,](https://www.humanc.nl/team/gerke-visser/) [Petra,](https://www.humanc.nl/team/petra-berry/) [Willemijn](https://www.humanc.nl/team/willemijn-dekker/),[ Zilla](https://www.humanc.nl/team/zilla-uiterwijk/) and [Sjef.](https://www.humanc.nl/team/sjef-van-gool/)


    **Interested?**

    Contact one of our colleagues directly, or for more information contact [Marit.](https://www.humanc.nl/team/marit-weiss/)

connect-to-perform:
  title: Connect to Perform
  pagina-afbeelding: /assets/images/upload/verandering-transitie.jpg
  landing-tekst: >-
    'Connect to Perform' is the philosophy that forms the basis for Human Connection's consultancy work. It demonstrates how teams and organizations can move towards a more effective and pleasant way of working by making (mutual) connections. To bridge the gap between 'theory' and 'applying it yourself', we have designed a game that is played with great success in organizations and during our open evenings.
  methoden: Connect to Perform Culture Development
  methoden-tekst: " "
  pagina-illustratie: /assets/images/upload/connect-to-perform-ingevuld.jpg
  werkwijze-titel: "Connect to Perform: the game "
  werkwijze-tekst: >-
    During the game, using a fictional situation, you gain insight into the methodology and possible interventions to develop organizational culture and performance. It becomes clear how you can identify which development phase an organization (or team) culture is in. Based on practical examples, you playfully see what is needed to take the next development step and what things actually backfire.


    You gain insight into about fifty different interventions applicable in work practice, to influence the behavior and culture of a team and organization. In short, in a few hours, you are interactively immersed in our successful approach on how to make more impact with your team.
  werkvorm-titel: Open Game Evening
  werkvorm-tekst: >
    As an introduction, we organize an open game evening several times a year, nowadays often online, where our relations and interested parties are welcome to get acquainted with this methodology. (participation is completely free and without further obligations) Via a login to our online learning portal, you get access to videos with explanations and background information. Moreover, experience shows that it is very interesting to exchange thoughts with people you didn't know before, working in diverse organizations.


    In organizations, we play the game (online or offline) in MT trajectories or leadership programs. We have different formats, depending on the time and interest of the target group, and we also customize the content of the game where necessary. The translation to the work context, in light of the organization's strategy, and also the concretization 'what will I do with it tomorrow' are important parts of the debriefing and any follow-up.


    The game can also be requested as a standalone workshop. Think of a half or full day, online or offline, for a group of 4 to 80 participants. For more information, please send an email to Jojanneke van Goïnga.
  button1: Learn more about Connect to Perform
  more-info: /assets/images/upload/connect_to_perform.pdf
  button2: Sign up here for the open game evening

