werken-bij:
  title: Working at
  vacature-open: false
  pagina-afbeelding: /assets/images/upload/parachute.jpg
  landing-tekst: We are looking for someone who can stand in front of a group with self-confidence and a fresh perspective, and is also capable of conducting individual coaching sessions. Your fresh perspective and creativity are very welcome, as is your ability to, regardless of the circumstances, deal constructively with group dynamics. Your perspective is broader than personal development alone; you are interested in organizational development, from strategy to execution, and are eager to learn more about it.
  kop: As coach/facilitator of development programs
  wat-je-doet: "What you'll Do:"
  wat-je-doet-tekst: |-
    You create custom programs in which employees and managers of organizations can develop themselves. Think of a year-long trajectory 'Personal Leadership', a 'Masterclass trajectory for talent', or other forms of trainee or leadership programs.

    We are looking for someone who can stand in front of a group with self-confidence and a fresh perspective, and is also capable of conducting individual coaching sessions. Your fresh perspective and creativity are very welcome, as is your ability to, regardless of the circumstances, deal constructively with group dynamics. Your perspective is broader than personal development alone; you are interested in organizational development, from strategy to execution, and are eager to learn more about it. You can collaborate well and are simultaneously autonomous enough to find your own way in our small-scale, flat organization. Mirroring clients, colleagues, and also turning the spotlight on yourself, you find an appealing challenge.
  wat-we-bieden: 'What We Offer You:'
  wat-we-bieden-tekst: |-
    * A salary that matches your knowledge and experience. 

    * An end-of-year bonus based on the profit made together. 

    * A laptop, phone, 1st class public transport card, everything you need to work well hybridly, and good secondary benefits. 

    * An office in the heart of Amsterdam, a 2-minute walk from CS (Central Station) (where you only need to be when working on assignments with colleagues).
  contact: Contact Meggie via [meggie@humanc.nl](#) or 06 50 83 56 58.
  uitzendbureaus: Temporary employment or recruitment agencies need not respond to this vacancy.
