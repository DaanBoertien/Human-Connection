  actievraag: What challenges are you facing in your organization?
  wat-wij-doen-1-tekst: >-
    We advise and guide teams and organizations through changes. Through longer
    trajectories (lasting cultural change or reorganizations), shorter
    interventions (teambuilding and proactive behavior), and everything in
    between.


    Examples include:


    * Transformation to more self-management  

    * Facilitating in-depth conversations and powerful decision-making.  

    * Culture development: better performance and a more (pro)active culture.  

    * Reorganizations, mergers, optimizing collaborations  

    * Compliance and integrity issues  

    * Implementing and guiding Agile/Scrum
  slogan: Change is human work
  wat-wij-doen-2-tekst: >-
    As interim professionals, we are part of the organization for a while. As
    managers or directors, we, together with the strategic partners present in
    the organization, proactively set a course that aligns with the bigger
    picture. We enjoy doing this in combination with a change assignment.


    We do this, for example, in the areas of:


    * Change management  

    * HR management  

    * Strategy implementation  

    * ICT management  

    * L&D professional
  contact-button: Send Message
hoe-wij-werken:
  waar-wij-voor-staan: Methods and formats
  landing-tekst: >-
    Everything we do is tailor-made, because every change has its own dynamics,
    complexity, and pace.


    We have extensive knowledge and have vast experience in several methodologies. We use theories and models as a collective frame of reference and common language. The emphasis for us is always on direct applicability in daily work.
  waarde-1-tekst: "It starts with personal contact. Together with a client, we
    look at the context of the organization and the people on the work floor is.
    We look with a broad view on the whole: 'what is really going on here?'"
  waarde-2-tekst: Based on the intake, we advise on an effective approach. We let
    the organization take the lead as much as possible. We design and plan
    ahead, preferably together with the people involved. We create realistic
    expectations and frameworks.
  waar-wijvoor-staan-tekst: >-
    Examples of methods and formats are: Connect to Perform culture development,
    agile/scrum, Deep Democracy, business drawing, Insights Discovery, Voice
    Dialogue, irreversible change, Lencioni, Scaling Up, designing with the
    learning infrastructure, various creative formats


    Development-oriented as we are, we stay up to date with the latest insights in theory and practice.
  waarde-3-tekst: We guide the implementation step by step, so that adjustment is
    always possible. We work methodically where necessary. We understand the
    dynamics and complexity of organizations and always have an eye for the
    individual and their work and private context.
  waarde-4-tekst: Especially at difficult moments, or when things seem too quiet,
    we help to push through.  We help turn awareness into action on the work
    floor. Not clinging rigidly to the 'plan from six months ago', but again in
    relation to the current course and circumstances of the organization. With a
    focus on long-term results.​
  waarde-5-tekst: Development is never finished. However, we find it important
    that our clients can continue independently for a while after our guidance.
    We help to evaluate sharply and anticipate future developments. And we
    always keep the line open for a quick chat or catch-up.
