home:
  slogan: Change is driven by people
  landing-tekt: |-
    Human Connection is a management consultancy that focuses on the human side of organizations. In various roles, we guide leaders, teams, and individual professionals to develop and work more proactively (together).

    We work in a tailor-made manner, taking into account each specificity of the project and with a broad view of people in their context, healthy business operations, and the development of organizational culture.

    Our experience is wide-ranging. We love a complex challenge, and look at opportunities with optimism.
  pagina-afbeelding: /assets/images/upload/parachute.jpg
  waar-wij-voor-staan: What we stand for
  waar-wijvoor-staan-tekst: 'We do what we say and say what we do. Both in how we collaborate internally within our company, and how we collaborate with our clients. We always work:'
  waarde-1-titel: In Connection
  waarde-1-tekst: |-
    Synergy arises where people are connected with themselves, with each other, and with the purpose of the organization.

    Self-awareness, ownership, engagement, and taking responsibility are central to this. We stand for this ourselves, and this is also exactly what we help our clients with. We bring our own personalities, experiences, and 'humanity' to everything we do.
  waarde-1-afbeelding: /assets/images/upload/icoon3dun.png
  waarde-2-titel: Built on Trust
  waarde-2-tekst: "For us, trust is the foundation from which we work. Amongst colleagues and in collaboration with our clients. It is our second nature, to build trust between people and within organizations wherever we work. We approach people and their issues positively: we inherently trust everyone's good intentions, capabilities, and resilience."
  waarde-2-afbeelding: /assets/images/upload/icoon2dun.png
  waarde-3-titel: In Context
  waarde-3-tekst: |-
    We take a broad view of every question and ask ourselves: 'What is really going on here? What patterns are at play?'

    The interplay between various factors (such as organizational structure, way of working, culture, the changing external world) determines success. Therefore, we closely align with the context of an organization and people, and everything we do is tailor-made.
  waarde-3-afbeelding: /assets/images/upload/icoon1dun.png
  wat-wij-doen: What we do
  wat-wij-doen-tekst: 'We approach every issue with an organization-wide perspective. We do this from several areas of expertise:'
  wat-wij-doen-1-titel: Organizational development & team development
  wat-wij-doen-1-tekst: |-
    We advise and guide teams and organizations through changes. Through longer trajectories (lasting cultural change or reorganizations), shorter interventions (teambuilding and proactive behavior), and everything in between.

    Examples include:

    - Transformation to more self-management  
    - Facilitating in-depth conversations and powerful decision-making.  
    - Culture development: better performance and a more (pro)active culture.  
    - Reorganizations, mergers, optimizing collaborations  
    - Compliance and integrity issues  
    - Implementing and guiding Agile/Scrum
  wat-wij-doen-1-contact: |-
    \*\*Want to know more?\*\*\\
    Please contact Sjef or Zilla.
  wat-wij-doen-1-button: Contact Sjef
  wat-wij-doen-1-link: /team/sjef-van-gool/
  wat-wij-doen-2-titel: Interim Management
  wat-wij-doen-2-tekst: |-
    As interim professionals, we are part of the organization for a while. As managers or directors, we, together with the strategic partners present in the organization, proactively set a course that aligns with the bigger picture. We enjoy doing this in combination with a change assignment.

    We do this, for example, in the areas of:

    - Change management  
    - HR management  
    - Strategy implementation  
    - ICT management  
    - L&D professional
    - Social Safety
  wat-wij-doen-2-contact: |-
    \*\*Want to know more?\*\*\\
    Please contact Dorothé.
  wat-wij-doen-2-button: Contact Dorothé
  wat-wij-doen-2-link: /team/dorothé-wissink/
  wat-wij-doen-3-titel: Learning & Development
  wat-wij-doen-3-tekst: |-
    We guide personal and professional development for executives, managers, and professionals. Personal leadership and personal effectiveness are important themes here.

    We advise on the most effective approach and design and facilitate workshops or programs such as:

    - Development trajectories and training programs  
    - Leadership programs  
    - Intervision (Peer consultation)  
    - [Individual coaching](https://www.humanc.nl/en/coaching/)  
    - Talent management and trainee programs  
    - Setting up an effective learning infrastructure
  wat-wij-doen-3-contact: |-
    **Want to know more?**\
    Please contact Marit or Annet.
  wat-wij-doen-3-button: Contact Marit
  wat-wij-doen-3-link: /team/marit-weiss/
  hoe-wij-werken: Want to know more about how we work?
