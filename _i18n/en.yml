connect-to-perform:
  button2: Sign up here for the open game evening
  landing-tekst: "'Connect to Perform' is the philosophy that forms the basis for
    Human Connection's consultancy work. It demonstrates how teams and
    organizations can move to a more effective and pleasant way of working by
    making (mutual) connections. To bridge the gap between 'theory' and
    'self-application', we have designed a game that is played with great
    success in organizations and during our open evenings."
  more-info: /assets/images/upload/connect_to_perform.pdf
  werkvorm-tekst: >-
    As an introduction, we organize an open game evening several times a year,
    nowadays mostly online, where our relations and interested parties are
    welcome to get acquainted with this methodology. (participation is
    completely free and without further obligations). Moreover, experience shows
    that it is very interesting to exchange thoughts with people you didn't know
    before and who are working in different organizations. When you partcipate,
    you will get access to videos with explanations and background information. 


    In organizations, we play the game (online or offline) in MT trajectories or leadership programs. We have different formats, depending on the time and interest of the target group, and we also tailor the game content where necessary. The translation to the work context, in light of the organization's strategy, and the concretization 'what will I do with it tomorrow' are important parts of the debriefing and possible follow-up.


    The game can also be requested as a standalone workshop. Think of a half or full day, online or offline, for a group of 4 to 80 participants. For more information, please send an email to Jojanneke.
  methoden: Connect to Perform Culture Development
  werkwijze-tekst: >-
    During the game, using a fictional situation, you will gain insight into the
    methodology and possible interventions to develop organizational culture and
    performance. You will learn how you can identify which development phase an
    organization (or team) culture is in. Based on practical examples, you will
    find out what is needed to take the next development step and what
    interventions have a counterproductive effect.


    You will gain insight into some fifty different interventions that can be applied in the work practice, to influence the behavior and culture of a team and organization. In short you will be immersed 

    interactively in our successful approach on how to make more impact with your team in a few hours.
  pagina-illustratie: /assets/images/upload/connect-to-perform-ingevuld.jpg
  werkvorm-titel: Open Game Evening
  pagina-afbeelding: /assets/images/upload/verandering-transitie.jpg
  werkwijze-titel: "Connect to Perform: the game "
  methoden-tekst: " "
  title: Connect to Perform
  button1: Learn more about Connect to Perform
vertrouwenspersoon:
  title: Confidential Advisor
  landing-tekst: >-
    **Confidential Advisor and prevention as a priority for a socially safe
    workplace**


    In a time where the emphasis is increasingly placed on **creating a healthy and pleasant work climate**, the question arises: how can organizations **guarantee a safe environment for their employees?** Appointing an (internal) confidential advisor is a frequently chosen **first step** for companies. To actually create and maintain a safe working environment, **broader measures and sometimes even a culture change are also necessary.**


    Integrating **social safety in the workplace** turns out to be a crucial factor in striving for **a sustainably healthy organization.**


    If there is a **pleasant learning and working climate, results are better, work is more effective, and more innovation** is possible. But what exactly does this entail, and how can organizations achieve this?
  pagina-afbeelding: /assets/images/upload/sociale-veiligheid.webp
  pagina-titel: Confidential Advisor
  vertrouwenspersoon-tekst: >-
    ### What is a socially safe workplace?


    Every workplace is different, every company culture is different. Yet, there are several elements that indicate a socially safe workplace:


    * Employees express themselves easily.  


    * They *also* talk about bottlenecks in the execution of their work.  


    * They talk openly and freely.  


    * They speak out without fear of consequences.


    ### Broad, systemic approach


    Human Connection distinguishes itself through a broader approach to creating a socially safe workplace, where a confidential advisor forms an essential part.


    The focus is on preventive measures, in addition to offering help with context analysis, interventions, and guidance, should escalation occur. We do this with a well-thought-out and systemic approach that we have been using and further developing since 1998. For more information, see [here](https://www.humanc.nl/hoe-wij-werken/).


    ### Human Connection offers:


    * Certified confidential advisors  


    * Each confidential advisor brings at least one additional expertise  


    * Replacement during illness or vacation  


    * Mutual intervision (peer consultation), unlocks an even broader perspective on issues  


    * Experience involving the entire organization at the start, continuation, and execution of (change) projects.


    ### Want to know more?


    Do you want to know more about how Human Connection views the role of the confidential advisor and prevention as a priority within a healthy workplace? Download our whitepaper here with key factors for a socially safe working environment.
coaching:
  title: Coaching
  landing-tekst: >-
    Do you want more self-insight, a better handle on your approach to certain
    matters, to break free from certain patterns, or concrete tools to be more
    effective in your work?


    With individual coaching, we help you in a tailored way. In a manner (live, outdoors, online, on the job) and rhythm (a quick boost or rather a calmer, somewhat longer trajectory?) that suits you.


    Based on an intake, you choose the coach that suits you, and together you determine what the coaching trajectory looks like. We tailor every coaching trajectory to your needs, goals, and context. On one hand, this involves depth: what is the background of your coaching question? And on the other hand, practical application: translating the insights you gain into your life and work.


    We coach from the work floor up to the executive level. Independently and confidentially. It can be linked to an organizational development trajectory or leadership development. But also for individuals looking for more balance or the next career step.
  pagina-afbeelding: /assets/images/upload/kompas.jpg
  pagina-titel: Coaching
  coaching-tekst: >-
    **Coaching Themes**


    The goal and theme of the coaching trajectory are always individually determined and often a combination of multiple elements. In practice, we often work with the following themes:


    * Personal development  


    * Communication  


    * Balance and resilience | stress, burnout  


    * Career development


    **Methods and Forms**

    We work with methods and materials from various management theories, psychology, and approaches such as Voice Dialogue, Co-active coaching, ACT, Insights, and Deep Democracy.

    In a coaching trajectory, various conversation forms and elements can be used, such as: conversations (live, online, or walking), in-depth assignments, practical assignments, coaching on the job, three-way conversations with the manager, reading material, background articles, reflection assignments, tests, and videos.


    **Always Custom-Made**

    We help you gain insight into your behavioral patterns, explore your comfort zone, and implement sustainable changes. This way, you work not only on your professional growth but also on a healthier balance and more resilience.


    So, we don't do 'standard programs'. It's not a matter of 'give me module 2 and session type x'. Instead, we look together with you at what works. In your context, with your goals, wishes, and own wisdom.


    **The Coaches**

    A large number of our colleagues are professional coaches. We all have our own background and style. What we agree on is that we stand for professionalism, confidentiality, and a broad perspective on the person, in their context.


    Below you will find the names of colleagues who coach: [](https://www.humanc.nl/team/anne-boertien/)[Marit](https://www.humanc.nl/team/marit-weiss/), [Anne](https://www.humanc.nl/team/anne-boertien/), [Jojanneke](https://www.humanc.nl/team/jojanneke-van-goinga/), [Meggie,](https://www.humanc.nl/team/meggie-van-de-bunt/) [Alexander, ](https://www.humanc.nl/team/gerke-visser/)[Gerke,](https://www.humanc.nl/team/gerke-visser/) [Petra,](https://www.humanc.nl/team/petra-berry/) [Willemijn](https://www.humanc.nl/team/willemijn-dekker/),[ Zilla](https://www.humanc.nl/team/zilla-uiterwijk/) and [Sjef.](https://www.humanc.nl/team/sjef-van-gool/)


    **Interested?**

    Contact one of our colleagues directly, or for more information contact [Marit.](https://www.humanc.nl/team/marit-weiss/)
