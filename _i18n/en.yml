home:
  wat-wij-doen-3-tekst: >-
    We guide personal and professional development for executives, managers, and
    professionals. Personal leadership and personal effectiveness are important
    themes here.


    We advise on the most effective approach and design and facilitate workshops or programs such as:


    * Development trajectories and training programs  

    * Leadership programs  

    * Intervision (Peer consultation)  

    * [Individual coaching](https://www.humanc.nl/coaching/)  

    * Talent management and trainee programs  

    * Setting up an effective learning infrastructure
