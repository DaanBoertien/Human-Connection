hoe-wij-werken:
  title: Hoe wij werken
  landing-tekst: |-
    Alles wat we doen is maatwerk, omdat elke verandering haar eigen dynamiek, complexiteit en tempo heeft.
    We hebben veel kennis in huis en zijn doorgewinterd in een aantal methodieken. Waar nodig zetten we deze in. Theorie en modellen gebruiken we als collectief begrippenkader en gemeenschappelijk taal. Het accent ligt bij ons altijd op directe toepasbaarheid in het dagelijkse werk.
  pagina-afbeelding: /assets/images/upload/impact.jpg
  waar-wij-voor-staan: Methoden en werkvormen
  waar-wijvoor-staan-tekst: |-
    Voorbeelden van methoden en werkvormen zijn: Connect to Perform-cultuurontwikkeling, agile/scrum, deep democracy, zakelijk tekenen, Discovery Insights, Voice Dialogue, onomkeerbaar veranderen, ontwerpen met de leerinfrastructuur, diverse creatieve werkvormen

    Ontwikkelingsgericht als we zijn, blijven we up to date met de nieuwste inzichten op het gebied van theorie en praktijk.
  waarde-1-titel: 1. Contact en context
  waarde-1-tekst: "Het begint bij persoonlijk contact. We bekijken samen met een opdrachtgever wat de context van de organisatie en de mensen op de werkvloer is. We kijken met een brede blik op het geheel: 'wat is hier nou echt aan de hand?'"
  waarde-1-afbeelding: ''
  waarde-2-titel: 2. Pragmatisch ontwerp en advies
  waarde-2-tekst: Op basis daarvan geven we advies over een effectieve aanpak. Hierbij laten we de organisatie zoveel mogelijk zelf aan het stuur staan. We ontwerpen vooruit, het liefst samen met de mensen om wie het gaat. We scheppen realistische verwachtingen en kaders.
  waarde-2-afbeelding: ''
  waarde-3-titel: 3.  Begeleiding
  waarde-3-tekst: We begeleiden de uitvoering stap voor stap, zodat bijstelling altijd mogelijk is. We werken methodisch waar nodig. We begrijpen de dynamiek en complexiteit van organisaties en hebben ook altijd oog voor de individuele mens en zijn werk en privé context.
  waarde-3-afbeelding: ''
  waarde-4-titel: 4. Doorpakken tot het echt werkt​
  waarde-4-tekst: Juist op lastige momenten, of op het punt dat het juist te stil lijkt, helpen we om door te pakken.  We helpen de bewustwording om te zetten in actie op de werkvloer. Niet krampachtig vasthoudend aan het 'plan van een half jaar geleden', maar opnieuw in relatie tot de huidige koers en omstandigheden van de organisatie. Met de blik op lange termijn resultaat.​
  waarde-4-afbeelding: ''
  waarde-5-titel: 5. Evalueren
  waarde-5-tekst: Ontwikkeling is nooit 'af'. Wel vinden we het belangrijk dat onze klanten na onze begeleiding ook weer een tijd zelfstandig verder weten gaan. We helpen scherp te evalueren en te anticiperen op volgende ontwikkelingen. En we houden de lijn voor een even sparren of bijpraten altijd open.
  waarde-5-afbeelding: ''
connect-to-perform:
  title: Connect to Perform
  pagina-afbeelding: /assets/images/upload/verandering-transitie.jpg
  landing-tekst: ‘Connect to Perform’ is het gedachtegoed dat de basis vormt voor Human Connection’s advieswerk. Het demonstreert hoe teams en organisaties naar een meer effectieve én prettige werkwijze te bewegen zijn door (onderlinge) verbinding te maken. Om de brug te slaan tussen ’theorie’ en ‘zelf toepassen’, hebben we een spel ontworpen wat met groot succes in organisaties en op onze open avonden gespeeld wordt.
  methoden: Connect to Perform Cultuurontwikkeling
  methoden-tekst: CTP cultuurontwikkeling
  pagina-illustratie: /assets/images/upload/connect-to-perform-ingevuld.jpg
  werkwijze-titel: 'Connect to Perform: het spel'
  werkwijze-tekst: |-
    Tijdens het spel krijg je aan de hand van een fictieve situatie inzicht in de methodiek en mogelijke interventies om de organisatiecultuur en prestaties te ontwikkelen. Er wordt helder hoe je kunt signaleren in welke ontwikkelfase een organisatie (of team)cultuur zich bevindt. Op basis van voorbeelden uit de praktijk zie je spelenderwijs in wat er nodig is om de volgende ontwikkelstap te maken en wat juist zaken zijn die averechts uitpakken.

    Je krijgt zicht op zo’n vijftig verschillende interventies die toepasbaar zijn in de werkpraktijk, om het gedrag en de cultuur van een team en organisatie te beïnvloeden. Kortom, in een paar uur wordt je op interactieve wijze ondergedompeld in onze succesvolle aanpak hoe je meer impact met je team maakt.
  werkvorm-titel: Open spelavond
  werkvorm-tekst: |-
    Als kennismaking organiseren we een aantal keer per jaar een open spelavond, tegenwoordig veelal online, waarop onze relaties en geïnteresseerden welkom zijn kennis te maken met deze methodiek. (deelname geheel gratis en zonder verdere verplichtingen) Via een inlog in ons online leerportaal krijg je toegang tot video’s met uitleg en achtergrondinformatie. Bovendien leert de ervaring dat het erg interessant is van gedachten te wisselen met mensen die je nog niet kende, werkzaam in diverse organisaties.

    In organisaties spelen we het spel (online of offline) in MT-trajecten of leiderschapsprogramma’s. We hebben verschillende werkvormen, afhankelijk van tijd en interesse van de doelgroep en passen het spel ook inhoudelijk op maat aan waar nodig. De vertaling naar de werkcontext, in het licht van de strategie van de organisatie en tevens de concretisering ‘wat ga ik er morgen mee doen’ zijn belangrijke onderdelen in de nabespreking en eventuele follow-up.

    Ook is het spel aan te vragen als losse workshop. Denk daarbij aan een halve of hele dag, online of offline voor een groep van 4 tot 80 deelnemers. Stuur voor meer informatie svp een mail naar Jojanneke van Goïnga.
  button1: Meer weten over Connect to Perform
  more-info: /assets/images/upload/connect_to_perform.pdf
  button2: Meld je hier aan voor de open spelavond
vertrouwenspersoon:
  title: Vertrouwenspersonen
  landing-tekst: |-
    **Vertrouwenspersoon en preventie als prioriteit voor een sociaal veilige werkplek**

    In een tijd waarin de nadruk steeds meer komt te liggen op het **creëren van een gezond en plezierig werkklimaat**, rijst de vraag: hoe kunnen organisaties **een veilige omgeving waarborgen voor hun medewerkers?** Het benoemen van een (interne) vertrouwenspersoon is voor bedrijven een veel gekozen **eerste stap.** Om daadwerkelijk een veilige werkomgeving te creëren en houden, zijn daarnaast **bredere maatregelen en soms zelfs een cultuurverandering nodig.**

    Het **integreren van sociale veiligheid op de werkplek** blijkt namelijk een cruciale factor te zijn in het streven naar **een duurzaam gezonde organisatie.**

    Als er een **prettig leer- en werkklimaat is, zijn de resultaten beter, wordt er effectiever gewerkt en is er meer innovatie** mogelijk is. Maar wat houdt dit precies in, en hoe kunnen organisaties dit realiseren?
  pagina-afbeelding: /assets/images/upload/sociale-veiligheid.webp
  pagina-titel: Vertrouwenspersoon
  vertrouwenspersoon-tekst: |-
    ### Wat is een sociaal veilige werkplek?

    Iedere werkplek is anders, iedere bedrijfscultuur is anders. Toch is er een aantal elementen waaraan je herkent dat er sprake is van een sociaal veilige werkplek:

    - Medewerkers uiten zich makkelijk.
    - Ze praten óok over knelpunten in de uitvoering van hun werk.
    - Ze praten open en vrij.
    - Ze spreken zich uit zonder angst voor de gevolgen.

    ### Brede, systemische benadering

    Human Connection onderscheidt zich door een bredere benadering van het creëren van een sociale veilige werkplek, waarbij een vertrouwenspersoon een essentieel onderdeel vormt.

    De focus ligt op preventieve maatregelen, naast het bieden van hulp bij contextanalyse, interventies en begeleiding, mocht het toch tot escalatie komen. We doen dit met een doordachte en systemische aanpak die we al sinds 1998 gebruiken en doorontwikkelen. Kijk voor meer informatie [hier](https://www.humanc.nl/hoe-wij-werken/).

    ### Human Connection biedt:

    - Gecertificeerde vertrouwenspersonen
    - Ieder vertrouwenspersoon brengt minimaal een extra expertise mee
    - Vervanging bij ziekte of vakantie
    - Onderlinge intervisie, ontsluit een nog breder perspectief op kwesties
    - Ervaring met het betrekken van de hele organisatie bij start, vervolg en executie van (verander)traject.

    ### Meer weten?

    Wil je meer weten over hoe Human Connection kijkt naar de rol van vertrouwenspersoon en preventie als prioriteit binnen een gezonde werkplek? Download hier binnenkort ons whitepaper met sleutelfactoren van een sociaal veilige werkomgeving.
coaching:
  title: Coaching
  landing-tekst: |-
    Wil je meer zelfinzicht, meer grip op je aanpak van bepaalde zaken, af van bepaalde patronen, of concrete tools om in je werk effectiever te zijn?

    Met individuele coaching helpen we je op maat. Op een manier (live, buiten, online, on the job) en ritme (een snelle boost of liever een rustiger, wat langer traject?) die bij jou past.

    Op basis van een intake kies je de coach die bij jou past en met diegene bepaal je hoe het coachtraject eruit ziet. Elk coachtraject stemmen we af op jouw behoeften, doelen en context. Enerzijds gaat dat over verdieping: wat is de achtergrond van je coachvraag? En anderzijds over praktische toepassing: de inzichten die je opdoet vertalen naar jouw leven en werk.

    We coachen van werkvloer tot en met executive level. Onafhankelijk en vertrouwelijk. Het kan gekoppeld zijn aan een organisatie-ontwikkeltraject of leiderschapsontwikkeling. Maar ook voor mensen die individueel op zoek zijn naar meer balans of een volgende loopbaanstap.
  pagina-afbeelding: /assets/images/upload/kompas.jpg
  pagina-titel: Coaching
  coaching-tekst: |-
    **Coachthema’s**

    Het doel en thema van het coachtraject is altijd individueel bepaald en vaak een combinatie van meerdere elementen. In de praktijk werken wij veel met de volgende themas:

    - Persoonlijke ontwikkeling
    - Communicatie
    - Balans en veerkracht | stress, burn-out
    - Loopbaanontwikkeling

    **Methoden en vormen**

    We werken met methoden en materialen uit verschillende managementtheorieën, psychologie en stromingen zoals Voice Dialogue, Co-active coaching, ACT, Insights en Deep Democracy.

    In een coachtraject kunnen verschillende gespreksvormen en elementen worden ingezet, zoals: gesprekken (live, online of wandelend), verdiepingsopdrachten, praktijkopdrachten, coaching on the job, driegesprekken met de leidinggevende, leesmateriaal, achtergrondartikelen, reflectieopdrachten, testen en video’s.

    **Altijd op maat**

    We helpen je inzicht te krijgen in je gedragspatronen, je comfortzone te verkennen en duurzame veranderingen door te voeren. Zo werk je niet alleen aan je professionele groei, maar ook aan een gezondere balans en meer veerkracht.

    Aan een ‘standaardtraject’ doen wij dus niet. Het is geen kwestie van ‘doe me module 2 en gespreksvorm x'. We kijken juist samen met jou wat werkt. In jouw context, met jouw doelen, wensen en eigen wijsheid.

    **De coaches**

    Een groot aantal van onze collega’s is professioneel coach. We hebben allemaal onze eigen achtergrond en stijl. Waar we in overeenkomen is dat we staan voor professionaliteit, vertrouwelijkheid en de brede blik op de mens, in zijn context.

    Hieronder vind je de namen van collega’s die coachen: [Marit](https://www.humanc.nl/team/marit-weiss/), Simone,  [Jojanneke](https://www.humanc.nl/team/jojanneke-van-goinga/), [Alexander, ](https://www.humanc.nl/team/alexander-van-ravesteyn/)[Gerke,](https://www.humanc.nl/team/gerke-visser/) [Petra,](https://www.humanc.nl/team/petra-berry/) [ Zilla](https://www.humanc.nl/team/zilla-uiterwijk/) en [Sjef.](https://www.humanc.nl/team/sjef-van-gool/)

    **Interesse?**

    Neem direct contact op met een van onze collega's, of voor meer informatie neem contact op met [Marit.](https://www.humanc.nl/team/marit-weiss/)
inclusieve-organisaties:
  title: Inclusieve organisaties
  landing-tekst: |-
    - **Het creëren van een een gezond en plezierig werkklimaat** is een van de kernpunten waar Human Connection organisaties bij helpt.
    - Diversiteit, inclusie en sociale veiligheid zijn geen kwestie van het aan tafel zetten van meer verschillende mensen en het "elimineren van vooroordelen." Het vraagt om **dagelijkse vaardigheden**: nieuwsgierig blijven, luisteren zonder direct te oordelen, ruimte maken voor andere perspectieven en ongemak kunnen verdragen. En: wat gebeurt er daarna? Worden verschillen gezien en benut, in besluitvorming, beleid, op de werkvloer en manieren van samenwerken?
    - Het is een proces van het **ontwikkelen van empathie, het opbouwen van inclusieve vaardigheden en het veranderen van gedrag**.
    - Gezamenlijke visie, beleid, heldere doelen en kaders, procedures, inspanningen van boven tot beneden, in het collectief en individueel zijn hiervoor nodig.
    - We helpen bij het samen vormgeven van de gewenste cultuur, passend bij de organisatie, en de de manier van werken. Om zaken fundamenteel en in de kern te optimaliseren kijken we naar hoe dingen samenhangen en **onderliggende patronen**. Tegelijk maken we het ook **behapbaar en praktisch**.
    -  Waar mensen samen werken, en helemaal als dat onder druk of hoge ambitie is, worden verschillen van aanpak of mening zichtbaar. Dat ik waar het soms spannend of ongemakkelijk wordt. In deze verschillen ligt ook veel waarde verscholen.  Wij helpen organisaties, teams en individuen om **de waarde van verschillende persoonlijkheden en perspectieven te onderzoeken, te ontwikkelen en te verzilveren**.
  pagina-afbeelding: /assets/images/upload/12046.jpg
  pagina-titel: Hoe helpen wij bij het vormgeven van een inclusieve, veilige cultuur?
  pagina-tekst: |-
    **Advies & inrichting sociale veiligheid**
    We adviseren en begeleiden organisaties bij het ontwikkelen van heldere kaders voor integriteit en sociale veiligheid. Denk aan het opzetten van een integrity office, beleid rondom sociale veiligheid, meldstructuren, procedures en rollen.

    **Externe vertrouwenspersonen**
    We bieden ervaren externe [vertrouwenspersonen](https://www.humanc.nl/vertrouwenspersoon/) die bijdragen aan een veilige en zorgvuldige werkomgeving.

    **Teamontwikkeling & inclusief leiderschap**
    We begeleiden teams, leergroepen en leiders in het ontwikkelen van een inclusieve manier van samenwerken. Altijd op maat, bijvoorbeeld via leiderschapsprogramma’s rond zelfkennis, open communicatie, concrete gesprekstools, omgaan met verschil, het voeren van moedige gesprekken en het maken van heldere afspraken. We baseren ons hierbij onder andere op de methode van Deep Democracy.

    **Begeleiding in de praktijk**
    Veiligheid en inclusie ontstaan vooral in de momenten waarop het ertoe doet. Daarom begeleiden we ook “on the job”: tijdens overleggen, strategische gesprekken of belangrijke besluitvorming. We helpen teams om alle perspectieven op tafel te krijgen en tot betere, gedragen besluiten te komen en op tafel te leggen wat nodig is. 'Zo licht als mogelijk, zo diepgaand als nodig'.

    **Participatieve aanpak**
    We ontwerpen en begeleiden participatieve processen waarin mensen uit alle lagen van de organisatie meedenken en bijdragen. We helpen om besluitvorming en gesprekken op alle niveaus meer co-creatief en inclusief te maken door participatieve bijeenkomsten of trajecten te organiseren. We halen ook stemmen op die normaal minder gehoord worden en verbinden inzichten uit de praktijk met strategische keuzes.

    Zo ontstaat een koers die niet alleen bedacht wordt aan de top, maar gedragen en verrijkt wordt door de hele organisatie. Tijdens het uitvoeren van de strategie of 'koersplan' zorgen we ervoor dat alle lagen van de organisatie inbreng houden en actief bijdragen aan implementatie en bijstelling. Zodat werknemers, van board tot werkvloer, zich gehoord en betrokken voelen en de organisatie wendbaar blijft, aangesloten bij ontwikkelingen in de markt en omgeving.

    Meer weten of even sparren met iemand die hier veel ervaring mee heeft? Neem contact op met [Olivier Sueur](https://www.humanc.nl/team/olivier-sueur/) | [06 10 58 02 64](tel:06 10 58 02 64) |[olivier@humanc.nl](mailto:olivier@humanc.nl)
inclusieve-participatieprocessen:
  title: Inclusieve participatie
  landing-tekst: |-
    Participatie vraagt om vakmanschap én om organisaties die participatie goed weten te ondersteunen. Onderzoek laat zien dat betekenisvolle participatie niet alleen afhangt van procesbegeleiding, maar ook van onder meer bestuurlijk commitment, heldere rolverdeling en goede terugkoppeling naar deelnemers. ([Kennisknooppunt Participatie](https://www.kennisknooppuntparticipatie.nl/nieuws/i/BR2xL/wat-vraagt-goede-participatie-van-professionals-n-organisaties-onderzoek-naar-competenties-voor-participatieprofessionals-en-organisaties-nu-beschikbaar))

    Bij lokale vraagstukken én bij grote maatschappelijke transities is participatie een vast onderdeel van hoe overheden beleid ontwikkelen en maatschappelijke vraagstukken aanpakken. Er wordt veel geïnvesteerd in het betrekken van inwoners, ondernemers en maatschappelijke organisaties. Tegelijk is de praktijk weerbarstig. Wij zien dat participatieprocessen uit voorzorg 'veilig' worden gehouden om 'gedoe te voorkomen', participatieprofessionals stoeien met hun rol en invloed binnen de dynamiek van de organisatie en niet zelden te maken krijgen met veel weerstand en oplopende emoties.

    ### **Wij geloven dat het anders kan**

    Wij zien dat effectieve participatie vraagt om:

    - **Burgers en stakeholders tijdig en oprecht betrekken**, zodat betere oplossingen en een sterkere relatie met de samenleving ontstaan.
    - **Strategische inbedding**: heldere afbakening van kaders, eigenaarschap en duidelijke communicatie vanuit management en bestuur.
    - **Goed getrainde participatieprofessionals en ambtenaren** die meer grip hebben op het ontwerpen en begeleiden van gesprekken en het omgaan met weerstand en tegengeluid.
    - Een **zorgvuldig ontworpen traject en goed gefaciliteerde bijeenkomsten** met een helder afgebakende vraag, waar ruimte is voor constructieve verschillen en elkaar echt horen.
    - **Tijdige communicatie en transparante terugkoppeling**  naar inwoners en belanghebbenden over proces, hun inbreng, afwegingen en genomen besluiten.
    - **Verankering in beleid en manier van samenwerken** binnen de organisatie en in relatie met de omgeving.

    Zo verzilvert participatie het potentieel om betere besluiten te nemen en de relatie met de samenleving te versterken en wordt het binnen de organisatie een waardevol onderdeel van hoe beleid, besluitvorming en uitvoering tot stand komen.
  pagina-afbeelding: /assets/images/upload/12046.jpg
  pagina-titel: Hoe doen wij dat?
  pagina-tekst: |-
    ### 1. Strategie en samenwerking

    Sterke participatie begint vóórdat het gesprek met inwoners start. We verkennen samen de interne context. We bakenen het speelveld scherp af en bepalen reële kaders: waar is ruimte voor invloed, welke keuzes liggen al vast en wat gebeurt er straks met de opbrengsten? Daarom onderzoeken we samen, of adviseren bij:

    - wat de bedoeling van participatie is;
    - welke inzichten nodig zijn om tot betere besluiten te komen;
    - welke inwoners en stakeholders betrokken moeten worden;
    - welke rollen, verantwoordelijkheden en besluiten helder moeten zijn;
    - hoe beleid, uitvoering en bestuur goed aangehaakt blijven.

    Zo ontstaat een helder vertrekpunt met gedeelde verwachtingen, eigenaarschap en een participatieproces waarvan de opbrengsten daadwerkelijk hun weg vinden naar beleid, uitvoering en besluitvorming.

    ### **2. Ontwikkelen en trainen**

    Participatie staat of valt met de mensen die het proces dragen. Daarom versterken we de participatieprofessionals, betrokken ambtenaren en teams die het gesprek met de samenleving vormgeven.

    In onze trainingen _Ontwerpen en begeleiden van inclusieve participatie_ werken we met concrete vraagstukken uit de praktijk. We combineren heldere theorie en praktische tools uit onder andere Deep Democracy, Art of Hosting en Liberating Structures met oefenen, toepassen en reflecteren.

    Thema’s die aan bod komen:

    - **Ontwerpen** van inclusieve en betekenisvolle participatiebijeenkomsten;
    - **Groepsdynamiek**, veiligheid creëren en omgaan met verschillende belangen;
    - **Conflict en verschil** benutten;
    - Omgaan met s**panning, emoties en polarisatie**;
    - **Macht, ranking** en micro interventies;
    - Rijke input ophalen en **vertalen naar beleid en besluitvorming**;
    - **Reflecteren** op eigen rol, houding en impact

    In de trainingen helpen we direct met vertaling naar praktijkcases. Onze aanpak is praktisch en dicht op het werk: oefenen, toepassen, reflecteren en verbeteren.

    Daarnaast begeleiden we eventueel het (tijdelijke) participatieteam in de samenwerking rondom het traject: hoe werk je samen, hoe betrek je stakeholders en hoe zorg je dat iedereen zijn rol pakt?

    Zo ontstaat meer stevigheid en vertrouwen om participatieprocessen vorm te geven: met meer grip op het ontwerp, meer vaardigheid in het begeleiden van complexe gesprekken en een sterkere verbinding tussen participatie, beleid en uitvoering.

    ### 3. Verankeren en doorontwikkelen

    We helpen organisaties om inzichten, samenwerking en werkwijzen te borgen, zodat participatie duurzaam onderdeel wordt van hoe beleid en uitvoering tot stand komen.

    We ondersteunen bijvoorbeeld bij:

    - het vertalen van opbrengsten naar beleid, besluitvorming en vervolgstappen;
    - het versterken van samenwerking tussen teams, afdelingen en bestuur;
    - het ontwikkelen van gedeelde principes, taal en werkwijzen rondom participatie;
    - reflectiesessies om samen te leren van ervaringen en verder te verbeteren;
    - het organiseren van vervolg, terugkoppeling en verbinding met inwoners en stakeholders.

    Zo groeit het vertrouwen en de vaardigheid om participatieprocessen vorm te geven die leiden tot rijkere inzichten, betere beleidskeuzes en meer betrokkenheid tussen overheid en samenleving.** Zo groeit de organisatie in duurzame participatie: zorgvuldig, praktisch en herhaalbaar.** Participatie wordt een vanzelfsprekend onderdeel van de manier van werken.

    #### Wie wij zijn

    Onze aanpak is ontwikkeld door ons, als drie professionals met ruime ervaring in participatie, organisatieontwikkeling en maatschappelijke transities. **We werken samen vanuit een gedeelde overtuiging: participatie wordt sterker wanneer organisaties zelf het vermogen ontwikkelen om het goed te doen.** Eerder werkten we samen bij het Nationaal Burgerberaad Klimaat en bij diverse overheden. Een succesvol van onze aanpak voorbeeld is de gemeente Den Haag, te bekijken via deze [video](https://vimeo.com/1190162776/d03903e9d5). We combineren onze expertise en werken vanuit een breed netwerk van professionals via onder andere Human Connection en [Human Dimensions](https://humandimensions.nl/).

    [**Karim Maarek**](https://www.linkedin.com/in/karimmaarek/)
    Karim ontwerpt en begeleidt participatieprocessen rond maatschappelijke vraagstukken en transities. Vanuit zijn achtergrond in innovatie, communicatie en Deep Democracy brengt hij verschillende perspectieven bij elkaar en ontwerpt hij processen die bijdragen aan inclusieve én uitvoerbare keuzes. Karim is onder andere als Deep Democracy instructor gelieerd aan Human Dimensions.

    [**Marit Weiss**](https://www.linkedin.com/in/maritvangrafhorst/)
    Marit begeleidt organisaties in verandering, met een focus op leiderschap, samenwerking en dialoog. Ze werkt als facilitator, trainer en organisatieadviseur via Human Connection op het snijvlak van participatie en organisatieontwikkeling binnen de publieke en private sector en was betrokken bij meerdere burgerberaden.

    [**Tijmen Rümke**](https://www.linkedin.com/in/tijmenrumke/)
    Tijmen ontwerpt leer- en ontwikkelprocessen die organisaties helpen complexe vraagstukken met meer helderheid en gezamenlijkheid te benaderen. Vanuit zijn achtergrond als strategieconsultant bij Andersson Elffers Felix begeleidt hij leerprogramma’s, strategische sessies en intervisietrajecten.

    #### In gesprek?

    Staat jullie organisatie aan het begin van een participatievraagstuk, of zoeken jullie hoe participatie meer impact kan maken? We denken graag mee over een aanpak die past bij jullie ambitie, organisatie en maatschappelijke context.

    Neem contact op met een van ons voor meer info en om van gedachten te wisselen.
    Mail via deze link met [Marit](mailto:Marit@humanc.nl)
