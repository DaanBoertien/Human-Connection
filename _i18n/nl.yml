hoe-wij-werken:
  waar-wij-voor-staan: Methoden en werkvormen
  landing-tekst: >-
    Alles wat we doen is maatwerk, omdat elke verandering haar eigen dynamiek,
    complexiteit en tempo heeft.  

    We hebben veel kennis in huis en zijn doorgewinterd in een aantal methodieken. Waar nodig zetten we deze in. Theorie en modellen gebruiken we als collectief begrippenkader en gemeenschappelijk taal. Het accent ligt bij ons altijd op directe toepasbaarheid in het dagelijkse werk.
  waarde-1-tekst: "Het begint bij persoonlijk contact. We bekijken samen met een
    opdrachtgever wat de context van de organisatie en de mensen op de werkvloer
    is. We kijken met een brede blik op het geheel: 'wat is hier nou echt aan de
    hand?'"
  waarde-2-tekst: Op basis daarvan geven we advies over een effectieve aanpak.
    Hierbij laten we de organisatie zoveel mogelijk zelf aan het stuur staan. We
    ontwerpen vooruit, het liefst samen met de mensen om wie het gaat. We
    scheppen realistische verwachtingen en kaders.
  waar-wijvoor-staan-tekst: >-
    Voorbeelden van methoden en werkvormen zijn: Connect to
    Perform-cultuurontwikkeling, agile/scrum, deep democracy, zakelijk tekenen,
    Discovery Insights, Voice Dialogue, onomkeerbaar veranderen, ontwerpen met
    de leerinfrastructuur, diverse creatieve werkvormen 


    Ontwikkelingsgericht als we zijn, blijven we up to date met de nieuwste inzichten op het gebied van theorie en praktijk.
  waarde-3-tekst: We begeleiden de uitvoering stap voor stap, zodat bijstelling
    altijd mogelijk is. We werken methodisch waar nodig. We begrijpen de
    dynamiek en complexiteit van organisaties en hebben ook altijd oog voor de
    individuele mens en zijn werk en privé context.
  waarde-4-tekst: Juist op lastige momenten, of op het punt dat het juist te stil
    lijkt, helpen we om door te pakken.  We helpen de bewustwording om te zetten
    in actie op de werkvloer. Niet krampachtig vasthoudend aan het 'plan van een
    half jaar geleden', maar opnieuw in relatie tot de huidige koers en
    omstandigheden van de organisatie. Met de blik op lange termijn resultaat.​
  waarde-5-tekst: Ontwikkeling is nooit 'af'. Wel vinden we het belangrijk dat
    onze klanten na onze begeleiding ook weer een tijd zelfstandig verder weten
    gaan. We helpen scherp te evalueren en te anticiperen op volgende
    ontwikkelingen. En we houden de lijn voor een even sparren of bijpraten
    altijd open.
  pagina-afbeelding: /assets/images/upload/impact.jpg
