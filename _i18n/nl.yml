werken-bij:
  contact: Neem contact op met Meggie via [meggie@humanc.nl](#) of 06 50 83 56 58.
  landing-tekst: We zoeken iemand die met zelfvertrouwen en een frisse blik voor
    de groep kan staan en ook in staat is individuele coachgesprekken te voeren.
    Je frisse blik en creativiteit zijn van harte welkom, evenals je vermogen
    om, ongeacht de omstandigheden, op een constructieve manier om te gaan met
    groepsdynamiek. Je blik is breder dan persoonlijke ontwikkeling alleen, je
    hebt interesse in organisatie ontwikkeling, van strategie tot uitvoering en
    bent eager om daar meer over te leren.
  wat-je-doet: Wat doe je als?
